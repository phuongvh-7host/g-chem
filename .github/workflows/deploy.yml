name: 🚀 Deploy to Production (cPanel)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Also allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Pre-flight checks
  # ─────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate WordPress structure
        run: |
          if [ ! -f "wp-login.php" ] && [ ! -f "wp-config-sample.php" ]; then
            echo "This doesn't look like a WordPress repo root"
            exit 1
          fi
          echo "WordPress structure OK"

      - name: Check required secrets exist
        run: |
          MISSING=""
          [ -z "${{ secrets.CPANEL_HOST }}" ]         && MISSING="$MISSING CPANEL_HOST"
          [ -z "${{ secrets.CPANEL_USER }}" ]         && MISSING="$MISSING CPANEL_USER"
          [ -z "${{ secrets.CPANEL_TOKEN }}" ]        && MISSING="$MISSING CPANEL_TOKEN"
          [ -z "${{ secrets.CPANEL_REPO_ROOT }}" ]    && MISSING="$MISSING CPANEL_REPO_ROOT"
          [ -z "${{ secrets.PROD_DOMAIN }}" ]         && MISSING="$MISSING PROD_DOMAIN"
          if [ -n "$MISSING" ]; then
            echo "Missing GitHub Secrets:$MISSING"
            exit 1
          fi
          echo "All secrets present"

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Backup production database via cPanel API
  # ─────────────────────────────────────────────────────────────
  # backup:
  #   name: Backup Production DB
  #   runs-on: ubuntu-latest
  #   needs: preflight
  #   steps:
  #     - name: Trigger DB backup via cPanel API
  #       run: |
  #         echo "Requesting database backup via cPanel API..."
  #         RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
  #           -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
  #           "https://${{ secrets.CPANEL_HOST }}:2083/execute/Backup/fullbackup_to_homedir")

  #         echo "cPanel API response: $RESPONSE"
  #         if [ "$RESPONSE" != "200" ]; then
  #           echo "Could not trigger backup request via cPanel API"
  #           exit 1
  #         fi
  #         echo "Backup request accepted by cPanel"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Trigger cPanel Git pull (the core deploy step)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via cPanel Git Pull
    runs-on: ubuntu-latest
    #needs: backup
    steps:
      - name: Trigger cPanel Git Version Control pull
        run: |
          echo "Triggering cPanel Git pull..."

          # cPanel UAPI: VersionControl - update (pulls latest from remote)
          RESPONSE=$(curl -s -G \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            --data-urlencode "repository_root=${{ secrets.CPANEL_REPO_ROOT }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update")

          echo "Response: $RESPONSE"

          # Check for errors in response
          if echo "$RESPONSE" | grep -q '"status":0'; then
            echo "cPanel Git pull failed:"
            echo "$RESPONSE" | python3 -m json.tool
            exit 1
          fi

          echo "cPanel Git pull triggered successfully"

      - name: Wait for cPanel deploy hook to complete
        run: |
          echo "Waiting 30s for .cpanel.yml tasks to finish..."
          sleep 40

  # ─────────────────────────────────────────────────────────────
